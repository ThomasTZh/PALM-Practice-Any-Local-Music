# Pinned inputs for the portable PALM release.
#
# The local `make package` uses the preserved cached standalone Python and uv
# when present; CI runs with --online and downloads these exact artifacts after
# checking each SHA-256. appimagetool is optional: without it the AppImage is
# skipped with a documented fallback, never silently mis-built.
schema_version = 1
release = "20260728"

[python]
version = "3.11.15"
build = "20260728"
url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/cpython-3.11.15%2B20260728-x86_64-unknown-linux-gnu-install_only.tar.gz"
sha256 = "2db18c7bb3a47e32ff41727abd1bb5f158a17d8681931770abf0ba911f5b6580"
size = 49078078
dest = "python"

[uv]
version = "0.12.0"
url = "https://github.com/astral-sh/uv/releases/download/0.12.0/uv-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "eaf842262aa1c418d8ecc5605f02ee1ebfd369124fa48548e85f9481a47831a9"
size = 21373358
dest = "bin/uv"

[appimagetool]
version = "1.9.1"
url = "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
sha256 = "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
size = 15092216
optional = true

[runtime]
lock = "packaging/app-runtime/uv.lock"
project = "packaging/app-runtime"
