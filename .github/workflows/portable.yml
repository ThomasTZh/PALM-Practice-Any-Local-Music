name: portable

on:
  workflow_dispatch:
    inputs:
      run_macos_intel:
        description: "Run the unsupported macOS Intel experimental job"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux full gate and tar
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.15.0 --activate
      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Python environment
        run: |
          python -m pip install uv==0.12.0
          uv sync --frozen
      - name: Install Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Backend tests without optional assets
        run: make test-backend TESTS="tests/unit --ignore=tests/unit/test_models"
      - name: Licence/package/update audit
        run: .venv/bin/python -m pytest -q tests/unit/test_licenses tests/integration/test_package_audit tests/unit/test_updater
      - name: Web tests and build
        run: |
          make test-web
          make build-web
      - name: Build Linux tar
        run: make package PACKAGE_ARGS="--online"
      - name: Validate Linux tar
        run: make test-package
      - name: Fresh-root browser smoke
        shell: bash
        run: |
          set -euo pipefail
          tar_path=$(ls dist/PALM-*-linux-x86_64.tar.gz | head -1)
          scratch=$(mktemp -d)
          tar -xzf "$tar_path" -C "$scratch"
          app=$(find "$scratch" -mindepth 1 -maxdepth 1 -type d | head -1)
          test -f "$app/install.json"
          test -f "$app/licenses/third_party/manifest.json"
          test -x "$app/bin/palm"
          python - "$app/install.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          assert payload["channel"] == "linux-x86_64"
          assert payload["assets"]["linux-x86_64"]["name"].endswith(".tar.gz")
          print("install metadata ok")
          PY
          data=$(mktemp -d)
          "$app/bin/palm" --window --no-browser --no-terminal --port 0 --data-dir "$data" >/tmp/palm-linux-smoke.out 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do [ -f "$data/run/server.json" ] && break; sleep 0.5; done
          test -f "$data/run/server.json"
          url=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$data/run/server.json")
          curl -fsS "${url%/}/api/health"
          PALM_URL="$url" pnpm --dir web exec node -e "const {chromium}=require('@playwright/test');(async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();await p.goto(process.env.PALM_URL,{waitUntil:'domcontentloaded'});const t=await p.title();if(!/PALM/i.test(t))throw new Error('unexpected title '+t);await p.waitForSelector('#root');console.log('browser smoke ok',t);await b.close()})().catch(e=>{console.error(e);process.exit(1)})"
          "$app/bin/palm" --stop --data-dir "$data"
          wait "$pid" || true
          test ! -f "$data/run/server.json"
      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: palm-linux
          path: |
            dist/PALM-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  windows:
    name: Windows x64 package and smoke
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web UI
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build uv
        shell: pwsh
        run: python -m pip install uv==0.12.0
      - name: Install pinned Python environment
        shell: pwsh
        run: uv sync --frozen
      - name: Build Windows ZIP
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/package_windows.py --online
      - name: Validate Windows ZIP
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/package_windows.py --check
      - name: Unit and adapter tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q tests/unit/test_platform_support tests/integration/test_package_windows
      - name: Licence/package/update audit
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q tests/unit/test_licenses tests/integration/test_package_audit tests/unit/test_updater
      - name: Verify Windows archive metadata and modes
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\PALM-*-windows-x86_64.zip | Select-Object -First 1
          $env:PALM_ZIP = $zip.FullName
          .\.venv\Scripts\python.exe -c @"
          import json, os, zipfile
          with zipfile.ZipFile(os.environ['PALM_ZIP']) as z:
              names = z.namelist()
              install = next(n for n in names if n.endswith('/install.json'))
              payload = json.loads(z.read(install))
              assert payload['channel'] == 'windows-x86_64'
              assert payload['assets']['windows-x86_64']['name'].endswith('.zip')
              assert any(n.lower().endswith('/palm.exe') for n in names)
              assert any(n.endswith('/licenses/third_party/manifest.json') for n in names)
              for suffix in ('/PALM.exe', '/python/python.exe', '/bin/uv.exe'):
                  info = next(z.getinfo(n) for n in names if n.lower().endswith(suffix.lower()))
                  assert info.create_system == 3, suffix
                  assert (info.external_attr >> 16) & 0o111, suffix
          print('windows install/licence/modes ok')
          "@
      - name: Windows Vamp extraction report
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "palm-vamp-extract"
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/ip7z/7zip/releases/download/26.06/7zr.exe" -OutFile "$dir\7zr.exe"
          if ((Get-FileHash "$dir\7zr.exe" -Algorithm SHA256).Hash.ToLower() -ne "e80db2dad715a6c5adabe292d31ed54e11f4e9b99ca349827b50573b175891bc") { throw "7zr hash mismatch" }
          Invoke-WebRequest -Uri "https://github.com/ip7z/7zip/releases/download/26.06/7z2606-extra.7z" -OutFile "$dir\extra.7z"
          if ((Get-FileHash "$dir\extra.7z" -Algorithm SHA256).Hash.ToLower() -ne "396c180f12d2247c24b0b1fcd482c6fc2a2700f61211ffede1061dd971f5e104") { throw "7z extra hash mismatch" }
          Invoke-WebRequest -Uri "https://github.com/vamp-plugins/vamp-plugin-pack/releases/download/v2.0/Vamp.Plugin.Pack.Installer.2.0.exe" -OutFile "$dir\vamp.exe"
          if ((Get-FileHash "$dir\vamp.exe" -Algorithm SHA256).Hash.ToLower() -ne "24d12812ffde04a20e7acbeb543860552d7aa05a729d9e9123b33c6e097c4d5f") { throw "Vamp installer hash mismatch" }
          & "$dir\7zr.exe" x "$dir\extra.7z" "-o$dir\seven" -y | Out-Null
          $seven = Get-ChildItem "$dir\seven" -Filter 7za.exe -Recurse | Select-Object -First 1
          if (-not $seven) { throw "7za.exe not extracted" }
          $result = "EXTRACTION_FAILED; one-UAC fallback documented (no no-admin claim)"
          & $seven.FullName x "$dir\vamp.exe" "-o$dir\vamp" -y | Out-Null
          if (Test-Path "$dir\vamp\qm-vamp-plugins.dll") { $result = "EXTRACTION_OK" }
          $result | Set-Content dist\vamp-extraction.txt -Encoding ascii
          Write-Host $result
          exit 0
      - name: Install Playwright browser
        shell: pwsh
        run: pnpm --dir web exec playwright install chromium
      - name: No-admin launch and browser smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem dist\PALM-*-windows-x86_64.zip | Select-Object -First 1
          $root = Join-Path $env:RUNNER_TEMP "palm-win-browser"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $root
          $app = Get-ChildItem $root -Directory | Select-Object -First 1
          $palm = Join-Path $app.FullName "palm.cmd"
          $data = Join-Path $env:RUNNER_TEMP "palm-win-browser-data"
          Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          & $palm --help
          if ($LASTEXITCODE -ne 0) { throw "palm.cmd --help failed" }
          $proc = Start-Process -FilePath $palm -ArgumentList @("--no-browser", "--no-terminal", "--port", "0", "--data-dir", $data) -PassThru
          try {
            $state = Join-Path $data "run\server.json"
            $deadline = (Get-Date).AddSeconds(90)
            while (-not (Test-Path $state) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
            if (-not (Test-Path $state)) { throw "server state was not written" }
            $url = (Get-Content $state -Raw | ConvertFrom-Json).url
            $health = Invoke-RestMethod -Uri ($url.TrimEnd('/') + "/api/health") -TimeoutSec 30
            if ($health.status -ne "ok") { throw "health was not ok" }
            $env:PALM_URL = $url
            pnpm --dir web exec node -e "const {chromium}=require('@playwright/test');(async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();await p.goto(process.env.PALM_URL,{waitUntil:'domcontentloaded'});const t=await p.title();if(!/PALM/i.test(t))throw new Error('unexpected title '+t);await p.waitForSelector('#root');console.log('browser smoke ok',t);await b.close()})().catch(e=>{console.error(e);process.exit(1)})"
            if ($LASTEXITCODE -ne 0) { throw "browser smoke failed" }
            & $palm --stop --data-dir $data
            if ($LASTEXITCODE -ne 0) { throw "palm.cmd --stop failed" }
            if (Test-Path $state) { throw "run state was not removed" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content dist\SHA256SUMS -Encoding ascii
      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: palm-windows
          path: |
            dist/PALM-*-windows-x86_64.zip
            dist/SHA256SUMS
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 package and smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web UI
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build uv
        run: python -m pip install uv==0.12.0
      - name: Install pinned Python environment
        run: uv sync --frozen
      - name: Build unsigned macOS app
        run: .venv/bin/python scripts/package_macos.py --online --dmg
      - name: Validate macOS ZIP
        run: .venv/bin/python scripts/package_macos.py --check
      - name: Unit and adapter tests
        run: .venv/bin/python -m pytest -q tests/unit/test_platform_support tests/integration/test_package_macos
      - name: Licence/package/update audit
        run: .venv/bin/python -m pytest -q tests/unit/test_licenses tests/integration/test_package_audit tests/unit/test_updater
      - name: Install Playwright browser
        run: pnpm --dir web exec playwright install chromium
      - name: Native app and browser smoke
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls dist/PALM-*-macos-arm64.zip | head -1)
          root=$(mktemp -d)
          unzip -q "$zip" -d "$root"
          app="$root/PALM.app"
          test -f "$app/Contents/Resources/app/install.json"
          test -f "$app/Contents/Resources/app/licenses/third_party/manifest.json"
          python - "$app/Contents/Resources/app/install.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          assert payload["channel"] == "macos-arm64"
          assert payload["assets"]["macos-arm64"]["name"].endswith(".zip")
          print("install metadata ok")
          PY
          "$app/Contents/MacOS/palm" --help
          data=$(mktemp -d)
          "$app/Contents/MacOS/palm" --no-browser --no-terminal --port 0 --data-dir "$data" >/tmp/palm-macos.out 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do [ -f "$data/run/server.json" ] && break; sleep 0.5; done
          test -f "$data/run/server.json"
          url=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$data/run/server.json")
          curl -fsS "${url%/}/api/health"
          "$app/Contents/MacOS/palm" --status --data-dir "$data"
          PALM_URL="$url" pnpm --dir web exec node -e "const {chromium}=require('@playwright/test');(async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();await p.goto(process.env.PALM_URL,{waitUntil:'domcontentloaded'});const t=await p.title();if(!/PALM/i.test(t))throw new Error('unexpected title '+t);await p.waitForSelector('#root');console.log('browser smoke ok',t);await b.close()})().catch(e=>{console.error(e);process.exit(1)})"
          "$app/Contents/MacOS/palm" --stop --data-dir "$data"
          wait "$pid" || true
          test ! -f "$data/run/server.json"
      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: palm-macos-arm64
          path: |
            dist/PALM-*-macos-arm64.zip
            dist/PALM-*-macos-arm64.dmg
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Download uploaded macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: palm-macos-arm64
          path: artifact
      - name: Verify flat artifact checksums and modes
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          echo "SHA256SUMS contents:"
          cat SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          zip=$(ls PALM-*-macos-arm64.zip | head -1)
          python - "$zip" <<'PY'
          import sys, zipfile
          executable = (
              "PALM.app/Contents/MacOS/palm",
              "PALM.app/Contents/Resources/app/bin/palm",
              "PALM.app/Contents/Resources/app/bin/uv",
              "PALM.app/Contents/Resources/app/python/bin/python3.11",
          )
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name in executable:
                  info = archive.getinfo(name)
                  assert info.create_system == 3, name
                  assert (info.external_attr >> 16) & 0o111, name
          print("artifact executable modes ok")
          PY

  macos-intel-optional:
    name: macOS Intel experimental (manual, unsupported)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos_intel }}
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report experimental host
        run: |
          uname -m
          python scripts/package_macos.py --help
      - name: Note non-support
        run: echo "macOS Intel is experimental, manual-only and not a supported target."
