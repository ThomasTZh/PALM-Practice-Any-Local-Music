name: Windows Vamp plugin bundle

# Builds the 64-bit Windows Vamp plugin set used by Sonic Annotator on Windows.
# The bundle is deliberately built in CI and attached to a held release; it is
# never committed or bundled in the PALM installer.
on:
  workflow_dispatch:
  push:
    tags:
      - plugins-win64-v*

permissions:
  contents: write

env:
  VAMP_SDK_COMMIT: 44c2487763eb248a933e9eff9169cfadee375009
  QM_COMMIT: c918afc070f79489758bb2dab6895972bd82066b
  QMDSP_COMMIT: e34a3cc188332ed7c33cd9257ef164de5b587191
  NNLS_COMMIT: 4c5f214a75cb354f8d8c933e161377c5b4d83713
  SONIC_URL: https://github.com/sonic-visualiser/sonic-annotator/releases/download/sonic-annotator-1.7/sonic-annotator-1.7-win64.zip
  SONIC_SHA256: c40717e029210cf1e1c97bc7dadea00cf4386327e67fdf9ca66027a91ea26693

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone pinned Vamp sources
        shell: cmd
        run: |
          git init qm-src
          cd qm-src
          git remote add origin https://github.com/c4dm/qm-vamp-plugins.git
          git fetch --depth 1 origin %QM_COMMIT%
          git checkout --detach FETCH_HEAD
          git init lib/vamp-plugin-sdk
          cd lib/vamp-plugin-sdk
          git remote add origin https://github.com/vamp-plugins/vamp-plugin-sdk.git
          git fetch --depth 1 origin %VAMP_SDK_COMMIT%
          git checkout --detach FETCH_HEAD
          cd ../../..
          git init qm-dsp-src
          cd qm-dsp-src
          git remote add origin https://github.com/c4dm/qm-dsp.git
          git fetch --depth 1 origin %QMDSP_COMMIT%
          git checkout --detach FETCH_HEAD
          cd ..
          xcopy /E /I /Y qm-dsp-src qm-src\lib\qm-dsp

      - name: Build QM key/barbeat plugin with MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: MSBuild QM plugins
        shell: cmd
        run: |
          msbuild qm-src\build\msvc\QMVampPlugins.sln /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /p:PlatformToolset=v143 /m
          if errorlevel 1 exit /b 1

      - name: Install Boost for Chordino
        shell: cmd
        run: |
          C:\vcpkg\vcpkg.exe install boost-iostreams:x64-windows boost-tokenizer:x64-windows boost-lexical-cast:x64-windows --clean-after-build
          if errorlevel 1 exit /b 1

      - name: Build Chordino with MSVC x64
        shell: cmd
        run: |
          cmake -S qm-src\lib\vamp-plugin-sdk -B vamp-msvc -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=OFF
          cmake --build vamp-msvc --config Release --target vamp-sdk
          if errorlevel 1 exit /b 1
          set BOOST=C:\vcpkg\installed\x64-windows
          set VAMPLIB=..\vamp-msvc\Release\vamp-sdk.lib
          git init nnls-src
          cd nnls-src
          git remote add origin https://github.com/c4dm/nnls-chroma.git
          git fetch --depth 1 origin %NNLS_COMMIT%
          git checkout --detach FETCH_HEAD
          cd ..
          cd nnls-src
          cl /nologo /O2 /EHsc /MD /std:c++17 /D_CRT_SECURE_NO_WARNINGS /D_USE_MATH_DEFINES /I..\qm-src\lib\vamp-plugin-sdk /I..\qm-src\lib\vamp-plugin-sdk\src\vamp-sdk /IC:\vcpkg\installed\x64-windows\include /c Chordino.cpp NNLSBase.cpp NNLSChroma.cpp Tuning.cpp chromamethods.cpp plugins.cpp viterbi.cpp
          cl /nologo /O2 /MD /D_CRT_SECURE_NO_WARNINGS /I..\qm-src\lib\vamp-plugin-sdk /c nnls.c
          link /DLL /OUT:nnls-chroma.dll *.obj %VAMPLIB% /LIBPATH:C:\vcpkg\installed\x64-windows\lib /EXPORT:vampGetPluginDescriptor
          if errorlevel 1 exit /b 1
          cd ..

      - name: Assemble and verify plugin bundle
        shell: cmd
        run: |
          mkdir bundle
          copy qm-src\build\msvc\x64\Release\qm-vamp-plugins.dll bundle\
          copy nnls-src\nnls-chroma.dll bundle\
          copy qm-src\qm-vamp-plugins.cat bundle\
          copy qm-src\qm-vamp-plugins.n3 bundle\
          copy nnls-src\nnls-chroma.cat bundle\
          copy nnls-src\nnls-chroma.n3 bundle\
          copy qm-src\COPYING bundle\COPYING-qm-vamp-plugins.txt
          copy nnls-src\COPYING bundle\COPYING-nnls-chroma.txt
          copy qm-src\lib\vamp-plugin-sdk\COPYING bundle\COPYING-vamp-plugin-sdk.txt
          > check.py echo from pathlib import Path
          >> check.py echo import struct
          >> check.py echo for path in sorted(Path("bundle").glob("*.dll")):
          >> check.py echo     data = path.read_bytes()
          >> check.py echo     assert data[:2] == b"MZ", path
          >> check.py echo     offset = struct.unpack_from("<I", data, 0x3C)[0]
          >> check.py echo     assert data[offset:offset+4] == b"PE\0\0", path
          >> check.py echo     machine = struct.unpack_from("<H", data, offset + 4)[0]
          >> check.py echo     assert machine == 0x8664, (path, hex(machine))
          >> check.py echo     print(path.name + ": PE32+ x86-64")
          python check.py

          curl -L -o sonic.zip "%SONIC_URL%"
          python -c "import hashlib,pathlib; p=pathlib.Path('sonic.zip'); assert hashlib.sha256(p.read_bytes()).hexdigest() == '%SONIC_SHA256%'"
          tar -xf sonic.zip
          set VAMP_PATH=%CD%\bundle
          sonic-annotator-win64\sonic-annotator.exe --list > plugins.txt
          type plugins.txt
          findstr /C:":chordino:simplechord" plugins.txt || exit /b 1
          findstr /C:":qm-keydetector:key" plugins.txt || exit /b 1
          findstr /C:":qm-barbeattracker:beats" plugins.txt || exit /b 1
          powershell -NoProfile -Command "Compress-Archive -Path bundle\* -DestinationPath vamp-plugins-win64.zip -Force"
          python -c "import hashlib,pathlib; p=pathlib.Path('vamp-plugins-win64.zip'); print(hashlib.sha256(p.read_bytes()).hexdigest(), p.stat().st_size)" > SHA256SUMS

      - name: Verify native Windows Sonic analysis
        shell: pwsh
        run: |
          @'
          import csv
          import os
          import statistics
          import subprocess
          from pathlib import Path

          lines = Path("plugins.txt").read_text(encoding="utf-8").splitlines()
          def pick(plugin, output):
              return next(line.strip() for line in lines if f":{plugin}:{output}" in line)

          transforms = {
              "chord": pick("chordino", "simplechord"),
              "key": pick("qm-keydetector", "key"),
              "beats": pick("qm-barbeattracker", "beats"),
              "bars": pick("qm-barbeattracker", "bars"),
          }
          env = dict(os.environ)
          env["VAMP_PATH"] = str(Path("bundle").resolve())
          sonic = Path("sonic-annotator-win64") / "sonic-annotator.exe"
          fixture = Path("tests/fixtures/audio/chords_c_am_f_g.wav")
          outputs = {}
          for role, transform in transforms.items():
              target = Path(f"windows-{role}.csv")
              subprocess.run(
                  [str(sonic), "-q", "-d", transform, "-w", "csv",
                   "--csv-one-file", str(target), "--csv-omit-filename",
                   "--csv-force", str(fixture)],
                  check=True, env=env,
              )
              outputs[role] = list(csv.reader(target.open(encoding="utf-8")))

          chords = [row[1] for row in outputs["chord"] if len(row) >= 2]
          assert "C" in chords and "Am" in chords and "F" in chords and "G" in chords, chords
          keys = [row[-1] for row in outputs["key"]]
          assert "C major" in keys, keys
          beat_times = [float(row[0]) for row in outputs["beats"] if row]
          bar_times = [float(row[0]) for row in outputs["bars"] if row]
          intervals = [b - a for a, b in zip(beat_times, beat_times[1:]) if b > a]
          bpm = round(60.0 / statistics.median(intervals), 3) if intervals else None
          assert bpm is not None and 100.0 <= bpm <= 160.0, bpm
          assert bar_times
          evidence = (
              f"fixture={fixture}\n"
              f"transforms={transforms}\n"
              f"chords={chords}\nkeys={keys}\n"
              f"bpm={bpm}\nbeats={len(beat_times)}\nbars={len(bar_times)}\n"
          )
          Path("windows-sonic-evidence.txt").write_text(evidence, encoding="utf-8")
          print(evidence)
          '@ | Set-Content -Encoding utf8 verify_sonic.py
          python verify_sonic.py

      - name: Upload Windows plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: vamp-plugins-win64
          path: |
            vamp-plugins-win64.zip
            SHA256SUMS
            windows-sonic-evidence.txt

      - name: Publish held plugin release
        if: startsWith(github.ref, 'refs/tags/plugins-win64-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Windows 64-bit Vamp plugin bundle
          body: |
            Native 64-bit qm-vamp-plugins (QM Key Detector, QM Bar and Beat
            Tracker) and NNLS-Chroma (Chordino), built from pinned sources.
            See SHA256SUMS and the GPL notices in the archive.
          files: |
            vamp-plugins-win64.zip
            SHA256SUMS
