name: portable-package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Build portable tar
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.15.0 --activate

      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build portable release (pinned downloads)
        run: make package PACKAGE_ARGS="--online"

      - name: Validate release structure and checksums
        run: make test-package

      - name: Clean Ubuntu 22.04 tar smoke test
        run: |
          set -euo pipefail
          tar_path=$(ls dist/PALM-*-linux-x86_64.tar.gz | head -1)
          scratch=$(mktemp -d)
          tar -xzf "$tar_path" -C "$scratch"
          app=$(find "$scratch" -mindepth 1 -maxdepth 1 -type d | head -1)
          docker run --rm -v "$app:/palm:ro" -e HOME=/tmp ubuntu:22.04 /palm/bin/palm --help

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: palm-portable-release
          path: |
            dist/PALM-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

