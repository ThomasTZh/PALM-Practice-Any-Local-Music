name: portable-package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build portable tar and draft release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.15.0 --activate

      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build portable release (pinned downloads)
        run: make package PACKAGE_ARGS="--online"

      - name: Validate release structure and checksums
        run: make test-package

      - name: Clean Ubuntu 22.04 tar smoke test
        run: |
          set -euo pipefail
          tar_path=$(ls dist/PALM-*-linux-x86_64.tar.gz | head -1)
          scratch=$(mktemp -d)
          tar -xzf "$tar_path" -C "$scratch"
          app=$(find "$scratch" -mindepth 1 -maxdepth 1 -type d | head -1)
          docker run --rm -v "$app:/palm:ro" -e HOME=/tmp ubuntu:22.04 /palm/bin/palm --help

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: palm-portable-release
          path: |
            dist/PALM-*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE-NOTES.md
          if-no-files-found: error

      - name: Create draft release (never publish automatically)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: PALM ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            dist/PALM-*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE-NOTES.md
