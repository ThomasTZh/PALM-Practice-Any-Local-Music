name: windows-package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build uv
        shell: pwsh
        run: python -m pip install uv==0.12.0
      - name: Install pinned Python environment
        shell: pwsh
        run: uv sync --frozen
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build native PALM.exe from source
        shell: pwsh
        run: .\packaging\windows\build_launcher.ps1 -Out .\packaging\windows\PALM.exe
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows ZIP
        shell: pwsh
        run: python scripts/package_windows.py --online
      - name: Validate Windows ZIP
        shell: pwsh
        run: python scripts/package_windows.py --check
      - name: Packaged interpreter project/export smoke
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\PALM-*-windows-x86_64.zip | Select-Object -First 1
          $root = Join-Path $env:RUNNER_TEMP "palm-win-export"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $root
          $app = Get-ChildItem $root -Directory | Select-Object -First 1
          $env:PALM_SMOKE_ROOT = Join-Path $env:RUNNER_TEMP "palm-win-export-data"
          $env:PYTHONPATH = Join-Path $app.FullName "src"
          $env:PALM_MODE = "packaged"
          $env:PALM_APP_ROOT = $app.FullName
          Remove-Item $env:PALM_SMOKE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          @'
          import os, struct
          from pathlib import Path
          from basseparate.projects import AudioInfo, Project, ProjectStore
          from basseparate.export import export_mixdown
          from basseparate.stems import StemFile, StemSet, publish_project_stems
          root = Path(os.environ["PALM_SMOKE_ROOT"])
          assets = root / "assets"
          pcm_dir = assets / "smoke"
          pcm_dir.mkdir(parents=True)
          frames, channels = 800, 1
          (pcm_dir / "pcm.f32").write_bytes(struct.pack("<f", 0.25) * (frames * channels))
          audio = AudioInfo(asset_id="smoke", source_name="smoke.wav", source_format="wav",
                            sample_rate=8000, channels=channels, frames=frames,
                            duration_seconds=frames / 8000, content_sha256="a" * 64)
          project = Project(id="smoke", name="Smoke", created_at="2026-01-01T00:00:00Z",
                            updated_at="2026-01-01T00:00:00Z", revision=1, audio=audio,
                            document={"stems": [{"id": "bass", "pcm_path": "assets/smoke/pcm.f32"}]})
          store = ProjectStore(root / "projects")
          store.create(project)
          saved = store.save(project)
          result = export_mixdown(saved, assets_root=assets, destination=root / "export.wav")
          assert result.frames == frames and result.path.is_file()
          stem = StemFile(label="bass", path=assets / "smoke" / "pcm.f32", frames=frames, channels=channels)
          stem_set = StemSet(key="smoke", directory=assets / "stems" / "smoke", sample_rate=8000,
                             channels=channels, frames=frames, stems=(stem,), device="cpu",
                             elapsed_seconds=0.0, cached=False, metadata={})
          published = publish_project_stems(store, "smoke", stem_set)
          assert published.document["stems"][0]["label"] == "bass"
          assert (root / "projects" / "smoke.json").is_file()
          print("packaged project/save/stem-publish/export ok", result.sha256[:12])
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP "palm-export-smoke.py") -Encoding utf8
          & (Join-Path $app.FullName "python\python.exe") (Join-Path $env:RUNNER_TEMP "palm-export-smoke.py")
          if ($LASTEXITCODE -ne 0) { throw "packaged project/export smoke failed" }
      - name: Unit and adapter tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q tests/integration/test_package_windows
      - name: No-admin ZIP smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem dist\PALM-*-windows-x86_64.zip | Select-Object -First 1
          $root = Join-Path $env:RUNNER_TEMP "palm-win-smoke"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $root
          $app = Get-ChildItem $root -Directory | Select-Object -First 1
          $palm = Join-Path $app.FullName "palm.cmd"
          $native = Join-Path $app.FullName "PALM.exe"
          if (-not (Test-Path $native)) { throw "PALM.exe missing from ZIP" }
          $data = Join-Path $env:RUNNER_TEMP "palm-win-data"
          Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          & $palm --help
          if ($LASTEXITCODE -ne 0) { throw "palm.cmd --help failed" }
          $env:PALM_DATA_DIR = $data
          $proc = Start-Process -FilePath $native -PassThru
          try {
            $state = Join-Path $data "run\server.json"
            $deadline = (Get-Date).AddSeconds(90)
            while (-not (Test-Path $state) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
            if (-not (Test-Path $state)) { throw "PALM.exe did not write server state" }
            $url = (Get-Content $state -Raw | ConvertFrom-Json).url
            $health = Invoke-RestMethod -Uri ($url.TrimEnd('/') + "/api/health") -TimeoutSec 30
            if ($health.status -ne "ok") { throw "health was not ok" }
            & $palm --stop --data-dir $data
            if ($LASTEXITCODE -ne 0) { throw "palm.cmd --stop failed" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
