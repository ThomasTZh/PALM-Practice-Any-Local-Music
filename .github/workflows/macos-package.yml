name: macos-package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  plugins:
    uses: ./.github/workflows/plugins-macos.yml

  macos:
    needs: plugins
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Download bundled macOS tools
        uses: actions/download-artifact@v4
        with:
          name: macos-bundled-tools
          path: storage/bundled-tools/macos
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm and build UI
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build uv
        run: python -m pip install uv==0.12.0
      - name: Install pinned Python environment
        run: |
          python -m pip install uv==0.12.0
          uv sync --frozen
      - name: Build unsigned macOS app
        run: python scripts/package_macos.py --online --dmg
      - name: Validate macOS ZIP
        run: python scripts/package_macos.py --check
      - name: Verify checksums
        run: cd dist && shasum -a 256 -c SHA256SUMS
      - name: Native package and DMG tests
        run: .venv/bin/python -m pytest -q tests/integration/test_package_macos
      - name: Native bundled Sonic analysis
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls dist/PALM-*-macos-arm64.zip | head -1)
          root=$(mktemp -d)
          unzip -q "$zip" -d "$root"
          app="$root/PALM.app"
          export PALM_MODE=packaged
          export PALM_APP_ROOT="$app/Contents/Resources/app"
          export PALM_DATA_DIR="$root/data"
          export PYTHONPATH="$PALM_APP_ROOT/src"
          export SONIC_FIXTURE="$PWD/tests/fixtures/audio/chords_c_am_f_g.wav"
          export SONIC_CACHE="$root/cache"
          "$PALM_APP_ROOT/python/bin/python3.11" - <<'PY'
          import os
          import sys
          from pathlib import Path
          from basseparate.analysis_backend import default_backend
          from basseparate.features import analyze_file
          result = analyze_file(Path(os.environ["SONIC_FIXTURE"]), cache_dir=Path(os.environ["SONIC_CACHE"]), backend=default_backend())
          assert result.bpm > 0 and result.key.label and len(result.chords) >= 2
          print("bundled Sonic analysis ok", result.bpm, result.key.label, len(result.chords), len(result.grid.beats))
          PY
      - name: Native app smoke
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls dist/PALM-*-macos-arm64.zip | head -1)
          root=$(mktemp -d)
          unzip -q "$zip" -d "$root"
          app="$root/PALM.app"
          "$app/Contents/MacOS/palm" --help
          data=$(mktemp -d)
          "$app/Contents/MacOS/palm" --no-browser --no-terminal --port 0 --data-dir "$data" >/tmp/palm-macos.out 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do [ -f "$data/run/server.json" ] && break; sleep 0.5; done
          test -f "$data/run/server.json"
          url=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$data/run/server.json")
          curl -fsS "${url%/}/api/health"
          "$app/Contents/MacOS/palm" --status --data-dir "$data"
          "$app/Contents/MacOS/palm" --stop --data-dir "$data"
          wait "$pid" || true
          test ! -f "$data/run/server.json"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: palm-macos-experimental
          path: |
            dist/PALM-*-macos-arm64.zip
            dist/PALM-*-macos-arm64.dmg
            dist/SHA256SUMS
          if-no-files-found: error
