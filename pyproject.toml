# Python source is run from src/ (pytest `pythonpath`), not installed into the
# environment: offline, one less moving part. See docs/progress.md.
[project]
name = "basseparate"
version = "0.1.0-dev"
description = "PALM (Practice Any Local Music): local practice studio with stems, chords, grid, loops and slow practice"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - unpublished" }
authors = [{ name = "basseparate" }]
classifiers = [
    "Private :: Do Not Upload",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
palm = "basseparate.launcher:main"
# Pinned to the versions already present in the preserved .venv. No new
# dependency may be added without an offline/licence/measured-benefit review.
dependencies = [
    "fastapi==0.142.0",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "platformdirs==4.12.1",
    "numpy==2.4.6",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = ["PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["basseparate"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests (real storage, real subprocesses)",
    "browser: browser end-to-end tests (Playwright)",
]
addopts = "-ra"

[tool.coverage.run]
source = ["src/basseparate"]
