[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basseparate"
version = "0.1.0-dev"
description = "Local music-analysis and bass practice application (Milestone 0: reproducible foundation)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - unpublished" }
authors = [{ name = "basseparate" }]
classifiers = [
    "Private :: Do Not Upload",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "platformdirs>=4.0,<5.0",
]

[project.scripts]
basseparate = "basseparate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/basseparate"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "basseparate/web/static"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = ["PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["basseparate"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests (real storage, real subprocesses)",
    "browser: browser end-to-end tests (Playwright)",
]
addopts = "-ra"

[tool.coverage.run]
source = ["src/basseparate"]
